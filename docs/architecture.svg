  <line x1="350" y1="248" x2="200" y2="278" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <line x1="450" y1="256" x2="450" y2="278" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>
