<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" font-family="'Segoe UI',system-ui,sans-serif">
  <rect width="900" height="280" rx="0" fill="#f8fafc"/>

  <text x="450" y="25" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700" letter-spacing="2">QUERY → EVIDENCE → AI → CONSENSUS → RESULT</text>

  <!-- Step boxes -->
  <!-- 1. Query -->
  <rect x="20" y="45" width="160" height="80" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="55" cy="65" r="14" fill="#0ea5e9"/>
  <text x="55" y="70" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">1</text>
  <text x="105" y="70" fill="#0f172a" font-size="12" font-weight="700">Query</text>
  <text x="40" y="90" fill="#64748b" font-size="9">User submits drugs,</text>
  <text x="40" y="102" fill="#64748b" font-size="9">dosages, patient info</text>
  <text x="40" y="114" fill="#0ea5e9" font-size="8">10 clinical tools available</text>

  <line x1="180" y1="85" x2="198" y2="85" stroke="#cbd5e1" stroke-width="2" marker-end="url(#m)"/>
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1"/></marker></defs>

  <!-- 2. Fetch -->
  <rect x="200" y="45" width="160" height="80" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="235" cy="65" r="14" fill="#8b5cf6"/>
  <text x="235" y="70" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">2</text>
  <text x="285" y="70" fill="#0f172a" font-size="12" font-weight="700">Evidence</text>
  <text x="220" y="90" fill="#64748b" font-size="9">Query-specific sources</text>
  <text x="220" y="102" fill="#64748b" font-size="9">fetched via web.render</text>
  <text x="220" y="114" fill="#8b5cf6" font-size="8">drugs.com · fda.gov · pubmed</text>

  <line x1="360" y1="85" x2="378" y2="85" stroke="#cbd5e1" stroke-width="2" marker-end="url(#m)"/>

  <!-- 3. AI -->
  <rect x="380" y="45" width="160" height="80" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="415" cy="65" r="14" fill="#f59e0b"/>
  <text x="415" y="70" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">3</text>
  <text x="465" y="70" fill="#0f172a" font-size="12" font-weight="700">AI Analysis</text>
  <text x="400" y="90" fill="#64748b" font-size="9">exec_prompt with JSON</text>
  <text x="400" y="102" fill="#64748b" font-size="9">UNTRUSTED DATA markers</text>
  <text x="400" y="114" fill="#f59e0b" font-size="8">Never guesses — fails safely</text>

  <line x1="540" y1="85" x2="558" y2="85" stroke="#cbd5e1" stroke-width="2" marker-end="url(#m)"/>

  <!-- 4. Consensus -->
  <rect x="560" y="45" width="160" height="80" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="595" cy="65" r="14" fill="#10b981"/>
  <text x="595" y="70" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">4</text>
  <text x="645" y="70" fill="#0f172a" font-size="12" font-weight="700">Consensus</text>
  <text x="580" y="90" fill="#64748b" font-size="9">Leader + validator run</text>
  <text x="580" y="102" fill="#64748b" font-size="9">same prompt independently</text>
  <text x="580" y="114" fill="#10b981" font-size="8">Severity must agree exactly</text>

  <line x1="720" y1="85" x2="738" y2="85" stroke="#cbd5e1" stroke-width="2" marker-end="url(#m)"/>

  <!-- 5. Result -->
  <rect x="740" y="45" width="140" height="80" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <circle cx="775" cy="65" r="14" fill="#059669"/>
  <text x="775" y="70" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">5</text>
  <text x="815" y="70" fill="#0f172a" font-size="12" font-weight="700">Result</text>
  <text x="760" y="90" fill="#64748b" font-size="9">Stored on-chain</text>
  <text x="760" y="102" fill="#64748b" font-size="9">Auto-alert if dangerous</text>
  <text x="760" y="114" fill="#059669" font-size="8">ID returned to caller</text>

  <!-- Tool grid -->
  <text x="450" y="150" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600" letter-spacing="2">10 CLINICAL TOOLS</text>

  <rect x="20" y="162" width="84" height="32" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="62" y="182" text-anchor="middle" fill="#991b1b" font-size="9" font-weight="600">💊 Interaction</text>

  <rect x="112" y="162" width="84" height="32" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="154" y="182" text-anchor="middle" fill="#1e3a8a" font-size="9" font-weight="600">💉 Dosage</text>

  <rect x="204" y="162" width="84" height="32" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="246" y="182" text-anchor="middle" fill="#92400e" font-size="9" font-weight="600">⚠️ Allergy</text>

  <rect x="296" y="162" width="84" height="32" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="338" y="182" text-anchor="middle" fill="#166534" font-size="9" font-weight="600">🩺 Treatment</text>

  <rect x="388" y="162" width="84" height="32" rx="6" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="430" y="182" text-anchor="middle" fill="#5b21b6" font-size="9" font-weight="600">👤 Patients</text>

  <rect x="480" y="162" width="84" height="32" rx="6" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="1"/>
  <text x="522" y="182" text-anchor="middle" fill="#9d174d" font-size="9" font-weight="600">📋 Prescription</text>

  <rect x="572" y="162" width="84" height="32" rx="6" fill="#ecfeff" stroke="#67e8f9" stroke-width="1"/>
  <text x="614" y="182" text-anchor="middle" fill="#155e75" font-size="9" font-weight="600">💊 Drug DB</text>

  <rect x="664" y="162" width="84" height="32" rx="6" fill="#fff1f2" stroke="#fda4af" stroke-width="1"/>
  <text x="706" y="182" text-anchor="middle" fill="#9f1239" font-size="9" font-weight="600">🚨 Alerts</text>

  <rect x="756" y="162" width="106" height="32" rx="6" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1"/>
  <text x="809" y="182" text-anchor="middle" fill="#3730a3" font-size="9" font-weight="600">🔬 Clinical Trials</text>

  <!-- Security badges -->
  <text x="450" y="215" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600" letter-spacing="2">SECURITY</text>

  <rect x="80" y="225" width="140" height="24" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="150" y="241" text-anchor="middle" fill="#991b1b" font-size="9">UNTRUSTED DATA markers</text>

  <rect x="235" y="225" width="120" height="24" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="295" y="241" text-anchor="middle" fill="#1e3a8a" font-size="9">HTTPS-only sources</text>

  <rect x="370" y="225" width="120" height="24" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="430" y="241" text-anchor="middle" fill="#166534" font-size="9">Access control</text>

  <rect x="505" y="225" width="110" height="24" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="560" y="241" text-anchor="middle" fill="#92400e" font-size="9">Fail-safely</text>

  <rect x="630" y="225" width="130" height="24" rx="12" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="695" y="241" text-anchor="middle" fill="#5b21b6" font-size="9">Query-specific sources</text>

  <!-- Footer -->
  <text x="450" y="270" text-anchor="middle" fill="#cbd5e1" font-size="8">StudioNet 61999 · Contract 0x2916Ec...703 · genlayer-medguard.vercel.app</text>
</svg>
